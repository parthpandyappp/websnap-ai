service: webtldr-express-service

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    REPLICATE_API_TOKEN: ${env:REPLICATE_API_TOKEN} # Uses your local .env

functions:
  app:
    handler: handler.handler
    events:
      - http:
          path: /{proxy+}
          method: any
          cors: true

plugins:
  - serverless-dotenv-plugin

custom:
  dotenv:
    path: .env
